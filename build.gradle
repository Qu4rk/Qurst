plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'com.diffplug.spotless' version '8.10.3'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

repositories {
    mavenCentral()
}

sourceSets {
    main {
        // Indigo is a Fabric renderer. Preserve its source as a migration reference.
        java.exclude 'net/wurstclient/mixin/xray/indigo/**'
        resources.exclude 'fabric.mod.json', 'wurst.accesswidener', 'intentionally_untranslated.json'
    }
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    clienttest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    keybindtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
    clienttestImplementation.extendsFrom implementation
    clienttestRuntimeOnly.extendsFrom runtimeOnly
    keybindtestImplementation.extendsFrom implementation
    keybindtestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    validateAccessTransformers = true
    addModdingDependenciesTo sourceSets.smoke
    addModdingDependenciesTo sourceSets.clienttest
    addModdingDependenciesTo sourceSets.keybindtest

    mods {
        wurst {
            sourceSet sourceSets.main
        }
        wurst_smoke {
            sourceSet sourceSets.smoke
        }
        wurst_clienttest {
            sourceSet sourceSets.clienttest
        }
        wurst_keybindtest {
            sourceSet sourceSets.keybindtest
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods.wurst]
        }
        clientSmoke {
            client()
            sourceSet = sourceSets.smoke
            loadedMods = [mods.wurst, mods.wurst_smoke]
            gameDirectory = file('run/smoke')
            programArgument '--username=Wurst-Bot'
        }
        clientTranslationsTest1 {
            client()
            sourceSet = sourceSets.clienttest
            loadedMods = [mods.wurst, mods.wurst_clienttest]
            gameDirectory = file('run/translations-test')
            programArgument '--username=Wurst-Bot'
            systemProperty 'wurst.test.phase', '1'
        }
        clientTranslationsTest2 {
            client()
            sourceSet = sourceSets.clienttest
            loadedMods = [mods.wurst, mods.wurst_clienttest]
            gameDirectory = file('run/translations-test')
            programArgument '--username=Wurst-Bot'
            systemProperty 'wurst.test.phase', '2'
        }
        clientKeybindsTest1 {
            client()
            sourceSet = sourceSets.keybindtest
            loadedMods = [mods.wurst, mods.wurst_keybindtest]
            gameDirectory = file('run/keybinds-test')
            programArgument '--username=Wurst-Bot'
            systemProperty 'wurst.test.phase', '1'
        }
        clientKeybindsTest2 {
            client()
            sourceSet = sourceSets.keybindtest
            loadedMods = [mods.wurst, mods.wurst_keybindtest]
            gameDirectory = file('run/keybinds-test')
            programArgument '--username=Wurst-Bot'
            systemProperty 'wurst.test.phase', '2'
        }
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

def nativeVersion = project.version.toString()
def nativeNeoVersion = project.neo_version
def nativeArchivesName = project.archives_base_name

processResources {
    inputs.property 'version', project.version
    inputs.property 'neo_version', project.neo_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: nativeVersion, neo_version: nativeNeoVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Jar).configureEach {
    from('LICENSE.txt') {
        rename { "LICENSE-${nativeArchivesName}.txt" }
    }
}

// A clean exit alone is insufficient: the test mod must attest to real startup.
def smokeMarker = layout.projectDirectory.file('run/smoke/wurst-bootstrap-pass.txt').asFile
tasks.named('runClientSmoke') {
    doFirst {
        java.nio.file.Files.deleteIfExists(smokeMarker.toPath())
    }
    doLast {
        if (!smokeMarker.isFile() || smokeMarker.text.trim() != '156 hacks; 52 commands; 18 other features; title screen') {
            throw new GradleException('Native Wurst bootstrap smoke test did not pass.')
        }
    }
}

// Slice 02a translations restart proof: two separate client JVMs share one
// isolated game directory. Phase 1 starts from a clean slate and persists a
// non-default selection through the real Options control; phase 2 asserts the
// restored state before any mutation. Only generated attestations are reset.
def translationsTestDir = layout.projectDirectory.dir('run/translations-test')
def translationsPhase1Marker =
    layout.projectDirectory.file('run/translations-test/phase1-pass.txt').asFile
def translationsFinalMarker =
    layout.projectDirectory.file('run/translations-test/wurst-translations-pass.txt').asFile
def translationsSettings =
    layout.projectDirectory.file('run/translations-test/wurst/settings.json').asFile
tasks.named('runClientTranslationsTest1') {
    doFirst {
        def dir = translationsTestDir.asFile.toPath()
        if (java.nio.file.Files.isDirectory(dir)) {
            java.nio.file.Files.walk(dir).sorted(java.util.Comparator.reverseOrder())
                .forEach(java.nio.file.Files::deleteIfExists)
        }
    }
}
tasks.named('runClientTranslationsTest2') {
    dependsOn 'runClientTranslationsTest1'
}
tasks.register('runClientTranslationsTest') {
    dependsOn 'runClientTranslationsTest2'
    doLast {
        if (!translationsPhase1Marker.isFile()
            || translationsPhase1Marker.text.trim()
                != 'phase=1 ok translations-toggle de_de') {
            throw new GradleException(
                'Translations test phase 1 did not attest its UI persistence.')
        }
        if (!translationsFinalMarker.isFile()
            || translationsFinalMarker.text.trim()
                != '156 hacks; 52 commands; 18 other features; de_de restored') {
            throw new GradleException(
                'Translations restart proof did not pass.')
        }
        def settings =
            new groovy.json.JsonSlurper().parse(translationsSettings)
        def forceEnglish = settings['Translations']['Force English']
        if (!(forceEnglish instanceof Boolean) || forceEnglish) {
            throw new GradleException(
                'Persisted Force English setting is not false.')
        }
    }
}

// Slice 02b keybind restart proof: two separate client JVMs share one
// isolated game directory. Phase 1 drives the real manager/editor/capture
// and profiles UI, persists a non-default profile; phase 2 asserts the
// restored bindings before any mutation, then proves native dispatch.
// Only this generated fixture is reset before phase 1.
def keybindsTestDir = layout.projectDirectory.dir('run/keybinds-test')
def keybindsPhase1Marker =
    layout.projectDirectory.file('run/keybinds-test/phase1-pass.txt').asFile
def keybindsFinalMarker =
    layout.projectDirectory.file('run/keybinds-test/wurst-keybinds-pass.txt').asFile
def keybindsActiveFile =
    layout.projectDirectory.file('run/keybinds-test/wurst/keybinds.json').asFile
def keybindsProfileFile =
    layout.projectDirectory.file('run/keybinds-test/wurst/keybinds/slice02b.json').asFile
tasks.named('runClientKeybindsTest1') {
    doFirst {
        def dir = keybindsTestDir.asFile.toPath()
        if (java.nio.file.Files.isDirectory(dir)) {
            java.nio.file.Files.walk(dir).sorted(java.util.Comparator.reverseOrder())
                .forEach(java.nio.file.Files::deleteIfExists)
        }
    }
}
tasks.named('runClientKeybindsTest2') {
    dependsOn 'runClientKeybindsTest1'
}
tasks.register('runClientKeybindsTest') {
    dependsOn 'runClientKeybindsTest2'
    doLast {
        if (!keybindsPhase1Marker.isFile()
            || keybindsPhase1Marker.text.trim()
                != 'phase=1 ok keybinds-profile slice02b') {
            throw new GradleException(
                'Keybind test phase 1 did not attest its profile journey.')
        }
        if (!keybindsFinalMarker.isFile()
            || keybindsFinalMarker.text.trim()
                != '156 hacks; 52 commands; 18 other features; keybinds restored') {
            throw new GradleException(
                'Keybind restart proof did not pass.')
        }
        def checkKeybinds = { File file ->
            def bindings = new groovy.json.JsonSlurper().parse(file)
            if (!(bindings instanceof Map) || bindings.size() != 16) {
                throw new GradleException(
                    "Unexpected bindings in ${file.name}: expected 16 entries.")
            }
            if (bindings['key.keyboard.f9'] != 'fullbright'
                || bindings['key.mouse.4'] != 'fullbright'
                || bindings.containsKey('key.keyboard.f8')
                || bindings.containsKey('key.keyboard.f10')) {
                throw new GradleException(
                    "Unexpected fixture bindings in ${file.name}.")
            }
        }
        checkKeybinds(keybindsActiveFile)
        checkKeybinds(keybindsProfileFile)
    }
}

import com.diffplug.spotless.generic.LicenseHeaderStep
spotless {
    lineEndings = 'WINDOWS'
    java {
        removeUnusedImports()
        leadingSpacesToTabs()
        trimTrailingWhitespace()
        eclipse().configFile(file('codestyle/formatter.xml'))
    }
    format('licenseHeader') {
        target('src/*/java/**/*.java')
        licenseHeaderFile(file('codestyle/license_header.txt'), LicenseHeaderStep.DEFAULT_JAVA_HEADER_DELIMITER).updateYearWithLatest(true)
    }
    json {
        target('src/**/*.json', 'src/**/*.mcmeta')
        gson().indentWithSpaces(2).version('2.14.0')
    }
}
