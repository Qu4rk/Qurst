name: Qurst native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build binary and corresponding sources
        run: ./gradlew build --console=plain
      - name: Verify native artifact, inventory and license
        run: python3 scripts/verify_neoforge_port.py
      - uses: actions/upload-artifact@v7
        with:
          name: qurst-development-jars
          path: build/libs/*.jar
          if-no-files-found: error
