<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Qurst — Wurst Client for native NeoForge</title>
  <desc id="desc">The supplied purple Qurst wordmark on a dark violet background. Target: Minecraft Java 26.3, NeoForge. The port is in development.</desc>
  <rect width="1200" height="440" rx="20" fill="#100b1c"/>
  <g id="target" fill="#c8a5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" letter-spacing="3">
    <text x="60" y="54">MINECRAFT JAVA 26.3</text>
    <text x="1140" y="54" text-anchor="end">NEOFORGE</text>
  </g>
  <svg id="supplied-wordmark" x="100" y="82" width="1000" height="278" viewBox="218 750 1564 476">
    <image x="0" y="0" width="2000" height="2000" xlink:href="qurst-transparent.png"/>
  </svg>
  <g id="description" fill="#eee8fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34">
    <text x="600" y="408" text-anchor="middle">Wurst, brought to native NeoForge.</text>
  </g>
</svg>
